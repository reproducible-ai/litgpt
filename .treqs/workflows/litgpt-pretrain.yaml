name: litgpt-pretrain reproduction

# Generated by scaffold_row.py. Clean-DAG rules baked in: every step is a NAMED
# `roar run -n <name>` (trace:off, same-ABI); outputs live in git-tracked dirs
# (.gitkeep) with files gitignored; publish --no-tag. Adjust commands as needed.

secrets:
  - HF_TOKEN            # wandb->trackio sync + roar put upload

setup:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    python -m pip install --quiet requests || true
    # litgpt deps. Deliberately NOT `.[extra]`:
    #  - huggingface-hub<1.0 — litgpt/scripts/download.py:77 reads
    #    huggingface_hub.constants.HF_HUB_ENABLE_HF_TRANSFER, removed in hub 1.0,
    #    but litgpt's own pin (>=0.30,<1.4) admits 1.x -> `litgpt download` dies
    #    with AttributeError. Pinned <1.0 until upstream guards the attribute.
    #  - torch/torchvision pinned to the host stack: litgpt pins litdata==0.2.59,
    #    whose UNBOUNDED `torchvision` dep resolves to a torchvision that hard-pins
    #    torch==2.13.0, silently replacing the image's torch 2.7.0 (+~4 GB nvidia-*).
    #  - torchmetrics is imported unconditionally by litgpt/pretrain.py but lives in
    #    the OPTIONAL [extra] group.
    # `-e .` then uninstall: installs litgpt's own deps without leaving an editable
    # self-dist (trap 1: never captured in a freeze; blinds the tracer to the repo).
    python -m pip install --quiet -e . 'huggingface-hub>=0.30,<1.0' 'litdata==0.2.59' 'torchmetrics>=1.3.1' 'torch==2.7.0' 'torchvision==0.22.0'
    python -m pip uninstall -y -q litgpt
    python -m pip list --format=freeze | grep '+' && echo 'WARNING: local-version pins present' || echo 'freeze ok: no local-version pins'
    roar --version
    roar tracer use preload
    roar tracer
    roar init || true
  trace: off

tokenizer:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export TRACKIO_SPACE_ID=reproducible-ai/experiments PYTHONUNBUFFERED=1
    roar run -n tokenizer --wandb-to-trackio -- python -m litgpt download EleutherAI/pythia-14m --tokenizer_only true
  trace: off

data:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export TRACKIO_SPACE_ID=reproducible-ai/experiments PYTHONUNBUFFERED=1
    roar run -n data --wandb-to-trackio -- curl -fsSL --create-dirs -o data_train/wikitext2_train.txt https://raw.githubusercontent.com/pytorch/examples/main/word_language_model/data/wikitext-2/train.txt -o data_val/wikitext2_valid.txt https://raw.githubusercontent.com/pytorch/examples/main/word_language_model/data/wikitext-2/valid.txt
  trace: off

prepare:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export TRACKIO_SPACE_ID=reproducible-ai/experiments PYTHONUNBUFFERED=1
    roar run -n prepare --wandb-to-trackio -- python -m reproduction.prepare_data --train_data_path data_train --val_data_path data_val --tokenizer_dir checkpoints/EleutherAI/pythia-14m --micro_batch_size 1 --max_seq_length 128
  trace: off

pretrain:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export TRACKIO_SPACE_ID=reproducible-ai/experiments PYTHONUNBUFFERED=1
    roar run -n pretrain --wandb-to-trackio -- python -m litgpt pretrain pythia-14m --tokenizer_dir checkpoints/EleutherAI/pythia-14m --data TextFiles --data.train_data_path data_train --data.val_data_path data_val --data.num_workers 0 --out_dir out --logger_name csv --devices 1 --seed 42 --train.max_tokens 2048 --train.max_seq_length 128 --train.micro_batch_size 1 --train.global_batch_size 2 --train.lr_warmup_steps 1 --train.log_interval 1 --train.save_interval 1000 --train.max_norm 1.0 --eval.interval 1000 --eval.max_iters 2 --eval.final_validation true
  trace: off

label:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar label set artifact out/final/lit_model.pth model.name=litgpt-pretrain model.version=1 license.id=Apache-2.0 license.name='Apache License 2.0' description='Truncated clean-room reproduction of the Lightning-AI/litgpt pretrain path: pythia-14m pretrained for 8 optimizer steps on WikiText-2 via the TextFiles data module. NOT converged.' documentation.url=https://github.com/reproducible-ai/litgpt/blob/main/tutorials/pretrain.md
  trace: off

publish:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar put out/final/lit_model.pth hf://reproducible-ai/litgpt --public --yes --no-tag -m "TRUNCATED reproduction: litgpt pretrain, pythia-14m, 8 optimizer steps on WikiText-2. NOT converged; pipeline demonstration only."
  trace: off
