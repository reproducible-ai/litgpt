name: litgpt-pretrain reproduction

# Generated by scaffold_row.py. Clean-DAG rules baked in: every step is a NAMED
# `roar run -n <name>` (trace:off, same-ABI); outputs live in git-tracked dirs
# (.gitkeep) with files gitignored; publish --no-tag. Adjust commands as needed.

secrets:
  - HF_TOKEN            # roar put upload
  # ROAR_WHEEL_URL is no longer needed: this row installs a PUBLISHED roar
  # (TestPyPI 0.4.4rc5) straight from its immutable file URL, so there is no
  # per-target shared secret to overwrite and no presigned URL to stage.

# ---------------------------------------------------------------------------
# WHY THIS RECIPE STILL USES `--logger_name csv`, AND WHY THERE IS NO
# `--wandb-to-trackio` ON ANY STAGE.
#
# litgpt DOES ship an experiment-logging integration and it IS switched on by a
# flag -- `--logger_name wandb`, one of the five choices in
# `litgpt/constants.py:7` (`csv, tensorboard, wandb, mlflow, litlogger`). So the
# usual excuse ("upstream has no logging") does not apply here. It was tried,
# and it cannot work, for a reason that lives in Lightning rather than litgpt.
#
# The bridge works by aliasing the module: roar's shim does
# `sys.modules["wandb"] = trackio` (roar/integrations/wandb_trackio.py). Two
# independent things in Lightning's WandbLogger defeat a module alias:
#
#   1. `lightning/pytorch/loggers/wandb.py:312`
#        if not _WANDB_AVAILABLE: raise ModuleNotFoundError(...)
#      `_WANDB_AVAILABLE = RequirementCache("wandb>=0.12.10")` reads INSTALLED
#      DISTRIBUTION METADATA. A `sys.modules` alias provides no metadata, so
#      with the recipe as-is WandbLogger dies in its constructor:
#        ModuleNotFoundError: Requirement 'wandb>=0.12.10' not met.
#
#   2. Install the real `wandb` distribution to satisfy (1) and it dies one step
#      later, at `lightning/pytorch/loggers/wandb.py:390`, inside the
#      `experiment` property:
#        import wandb
#        from wandb.sdk.lib import RunDisabled     # <-- here
#        from wandb.wandb_run import Run
#      Those are SUBMODULE imports. They are resolved through the aliased
#      package's `__path__`, which now points at trackio, so:
#        ModuleNotFoundError: No module named 'wandb.sdk'
#      They are unreachable: `litgpt/pretrain.py:156` calls
#      `fabric.logger.log_hyperparams(hparams)` on the wandb path, and
#      `WandbLogger.log_hyperparams` (wandb.py:435) touches `self.experiment`
#      before a single training step runs. `log_metrics` does the same.
#
# Verified by direct execution against lightning 2.6.5 (the resolve of litgpt's
# own `lightning>=2.6.1`), wandb 0.28.1, trackio 0.20.2, roar 0.4.4rc5 -- the
# rc5 shim fixes `init(resume=None)`, `run.get_url()` and `log(data=, step=)`,
# none of which is the failure here. Making it work means patching Lightning
# (the two symbols are used only for one `isinstance` check that is already
# `getattr`-guarded on the same line), and patching a dependency of the workload
# forfeits the zero-upstream-lines property this row rests on. So: no link.
#
# There is a second, independent reason not to arm the shim on THIS row. Merely
# setting `--wandb-to-trackio` makes roar's sitecustomize attempt `import
# trackio` in every traced process, and that attempt alone was enough to get
# `trackio` (plus gradio_client) attributed into the recorded freeze even when
# the import FAILED. Modern trackio requires `huggingface-hub>=1.10`, while this
# recipe must pin `huggingface-hub<1.0` (see setup). The resulting freeze was
# unsatisfiable --
#   Because trackio==0.33.0 depends on huggingface-hub>=1.10.0 and you require
#   huggingface-hub==0.36.2, ... your requirements are unsatisfiable.
# -- so `roar reproduce --lineage --run` installed 0 of 67 packages and every
# step died with ModuleNotFoundError, while all four tier-1 gates stayed green.
# ---------------------------------------------------------------------------

setup:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    python -m pip install --quiet requests || true

    # --- roar 0.4.4rc5, PUBLISHED to TestPyPI ---
    # Installed from the immutable TestPyPI file URL rather than a presigned S3
    # object: the S3 keys have been overwritten in place before, and the version
    # string alone cannot distinguish builds (four separate builds all reported
    # "0.4.4.dev0"). The sha256 is the build identity and is verified BEFORE the
    # install. The wheel file is installed directly -- not `--index-url
    # test.pypi.org` -- so roar's own dependencies still resolve from real PyPI.
    ROAR_WHEEL=roar_cli-0.4.4rc5-cp310-abi3-manylinux_2_34_x86_64.whl
    ROAR_WHEEL_SHA256=ed35ed6bda3b5698ab65a887e7390c2ac073123f6d94bfa27b8282285352219c
    ROAR_WHEEL_SRC=https://test-files.pythonhosted.org/packages/f0/e2/210129d82c059236902d4e3715cf7398925e72c2f646afc6e41a1a8b6bd1/$ROAR_WHEEL
    python -m pip uninstall -y -q roar-cli || true
    python - <<'PY'
    import glob, os, shutil, sysconfig
    for base in {sysconfig.get_paths()["purelib"], sysconfig.get_paths()["platlib"]}:
        for path in glob.glob(os.path.join(base, "roar*.dist-info")) + glob.glob(os.path.join(base, "roar")):
            print("purging stale roar install:", path)
            shutil.rmtree(path, ignore_errors=True)
    PY
    curl -fsSL "$ROAR_WHEEL_SRC" -o "/tmp/$ROAR_WHEEL"
    echo "$ROAR_WHEEL_SHA256  /tmp/$ROAR_WHEEL" | sha256sum -c -
    python -m pip install --quiet --no-cache-dir "/tmp/$ROAR_WHEEL"
    echo "roar binary in use: $(command -v roar)"
    roar --version
    roar --version | grep -q '0\.4\.4rc5' || { echo "FATAL: roar is not 0.4.4rc5"; exit 1; }
    python - <<'PY'
    import glob, os, roar, sys
    binderr = os.path.join(os.path.dirname(roar.__file__), "bin")
    found = sorted(os.path.basename(p) for p in glob.glob(binderr + "/*"))
    print("roar/bin:", found)
    want = {"libroar_tracer_preload.so", "roar-tracer", "roar-tracer-ebpf",
            "roar-tracer-preload", "roar-proxy", "roard"}
    missing = sorted(want - set(found))
    if missing:
        sys.exit(f"FATAL: roar wheel is missing tracer artefacts: {missing}")
    print("roar module:", roar.__file__)
    PY

    python -m pip install --quiet -e . 'huggingface-hub>=0.30,<1.0' 'litdata==0.2.59' 'torchmetrics>=1.3.1' 'torch==2.7.0' 'torchvision==0.22.0'
    python -m pip uninstall -y -q litgpt
    # `pip install -e .` leaves litgpt.egg-info/ behind, and importlib.metadata reads
    # it as an INSTALLED distribution. Since roar #264 attributes packages the
    # workload imported BY NAME, that leftover puts `litgpt==0.5.13` back into the
    # recorded freeze -- re-pinning from PyPI the very self-install we just removed
    # to keep the tracer honest (trap 1). Measured: present with the egg-info, absent
    # without. It is gitignored, so removing it keeps the worktree clean.
    rm -rf ./*.egg-info src/*.egg-info
    python -c "import importlib.metadata as m; assert not [d for d in m.distributions() if (d.metadata['Name'] or '').lower()=='litgpt'], 'litgpt still resolvable as a distribution'; print('litgpt is not a resolvable distribution (trap 1 clear)')"
    python -m pip list --format=freeze | grep '+' && echo 'WARNING: local-version pins present' || echo 'freeze ok: no local-version pins'
    roar --version
    roar tracer use preload
    roar tracer
    roar init || true
  trace: off

tokenizer:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    echo "TIMING tokenizer START $(date -u +%FT%T.%NZ)"
    roar run -n tokenizer -- python -m litgpt download EleutherAI/pythia-14m --tokenizer_only true
  trace: off

data:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    echo "TIMING data START $(date -u +%FT%T.%NZ)"
    roar run -n data -- curl -fsSL --create-dirs -o data_train/wikitext2_train.txt https://raw.githubusercontent.com/pytorch/examples/main/word_language_model/data/wikitext-2/train.txt -o data_val/wikitext2_valid.txt https://raw.githubusercontent.com/pytorch/examples/main/word_language_model/data/wikitext-2/valid.txt
  trace: off

prepare:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    echo "TIMING prepare START $(date -u +%FT%T.%NZ)"
    roar run -n prepare -- python -m reproduction.prepare_data --train_data_path data_train --val_data_path data_val --tokenizer_dir checkpoints/EleutherAI/pythia-14m --micro_batch_size 1 --max_seq_length 128
  trace: off

pretrain:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    echo "TIMING pretrain START $(date -u +%FT%T.%NZ)"
    roar run -n pretrain -- python -m litgpt pretrain pythia-14m --tokenizer_dir checkpoints/EleutherAI/pythia-14m --data TextFiles --data.train_data_path data_train --data.val_data_path data_val --data.num_workers 0 --out_dir out --logger_name csv --devices 1 --seed 42 --train.max_tokens 2048 --train.max_seq_length 128 --train.micro_batch_size 1 --train.global_batch_size 2 --train.lr_warmup_steps 1 --train.log_interval 1 --train.save_interval 1000 --train.max_norm 1.0 --eval.interval 1000 --eval.max_iters 2 --eval.final_validation true
  trace: off

label:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    echo "TIMING label START $(date -u +%FT%T.%NZ)"
    roar label set artifact out/final/lit_model.pth model.name=litgpt-pretrain model.version=1 license.id=Apache-2.0 license.name='Apache License 2.0' description='Truncated clean-room reproduction of the Lightning-AI/litgpt pretrain path: pythia-14m pretrained for 8 optimizer steps on WikiText-2 via the TextFiles data module. NOT converged.' documentation.url=https://github.com/reproducible-ai/litgpt/blob/main/tutorials/pretrain.md
  trace: off

publish:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    echo "TIMING publish START $(date -u +%FT%T.%NZ)"
    roar put out/final/lit_model.pth hf://reproducible-ai/litgpt --public --yes --no-tag -m "TRUNCATED reproduction: litgpt pretrain, pythia-14m, 8 optimizer steps on WikiText-2. NOT converged; pipeline demonstration only."
  trace: off
